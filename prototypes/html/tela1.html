<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberFlow - S1 Catálogo & Profissional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* =========================================
       DESIGN SYSTEM UNIFICADO (S1 & S2)
       ========================================= */
    :root {
      --bg-presentation-start: #9ca3af;
      --bg-presentation-end: #4b5563; 
      
      --bg-app: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #b91c1c;
      --accent-hover: #991b1b;
      --accent-light: #fef2f2;
      --disabled-bg: #f1f5f9;
      --disabled-text: #94a3b8;
      
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-btn: 14px;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* =========================================
       MOCKUP DO CELULAR (Sem frestas internas)
       ========================================= */
    .phone-mockup {
      width: 100%;
      max-width: 390px;
      height: 844px;
      background-color: var(--bg-app);
      border-radius: 52px; 
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 14px solid #141414;
      /* Aro metálico externo (sem inset para não criar degrau na tela) */
      box-shadow: 
        0 0 0 2px #374151,
        0 40px 60px -15px rgba(0, 0, 0, 0.65),
        0 20px 30px -10px rgba(0, 0, 0, 0.4);
    }

    /* Barra de Status */
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      z-index: 101;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-icons svg {
      height: 12px;
      fill: currentColor;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background-color: #000000;
      border-radius: 20px;
      z-index: 100;
    }

    /* =========================================
       CABEÇALHO PADRONIZADO
       ========================================= */
    .header {
      padding: 54px 24px 16px; 
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 8px;
    }

    .header h1 {
      font-size: 21px;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: -0.8px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
    }

    .header h1 span {
      font-weight: 400;
      color: var(--accent);
    }

    /* =========================================
       ÁREA DE CONTEÚDO
       ========================================= */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      padding-bottom: 130px;
      background-color: var(--bg-app);
    }

    .main-content::-webkit-scrollbar {
      display: none;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* =========================================
       SELEÇÃO DE PROFISSIONAL
       ========================================= */
    .professional-section {
      margin-bottom: 30px;
    }

    .professional-card {
      display: flex;
      align-items: center;
      background-color: var(--surface);
      border: 1.5px solid var(--border);
      padding: 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
      transition: all 0.2s ease;
    }

    .professional-card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      margin-right: 14px;
      background-image: url('https://ui-avatars.com/api/?name=Carlos+Silva&background=b91c1c&color=fff&bold=true');
      background-size: cover;
      flex-shrink: 0;
    }

    .prof-info {
      flex: 1;
    }

    .prof-name {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    .prof-role {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .chevron {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    /* =========================================
       CATÁLOGO DE SERVIÇOS
       ========================================= */
    .services-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .service-card input[type="checkbox"] {
      display: none;
    }

    .service-content {
      display: flex;
      align-items: center;
      background-color: var(--surface);
      border: 1.5px solid var(--border);
      padding: 18px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
      transition: all 0.2s ease;
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      margin-right: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .custom-checkbox svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: white;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .service-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .service-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      transition: color 0.2s ease;
    }

    .service-time {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .service-time svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .service-price {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
    }

    /* ESTADOS DE SELEÇÃO */
    .service-card input[type="checkbox"]:checked + .service-content {
      border-color: var(--accent);
      background-color: var(--accent-light);
    }

    .service-card input[type="checkbox"]:checked + .service-content .custom-checkbox {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    .service-card input[type="checkbox"]:checked + .service-content .custom-checkbox svg {
      opacity: 1;
      transform: scale(1);
    }

    .service-card input[type="checkbox"]:checked + .service-content .service-name {
      color: var(--accent);
    }

    /* =========================================
       RODAPÉ FIXO PADRONIZADO
       ========================================= */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: var(--surface);
      padding: 18px 24px 30px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.06);
      z-index: 10;
    }

    .total-area {
      display: flex;
      flex-direction: column;
    }

    .total-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .total-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 2px;
      letter-spacing: -0.5px;
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--surface);
      border: none;
      padding: 15px 28px;
      border-radius: var(--radius-btn);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(185, 28, 28, 0.25);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(185, 28, 28, 0.35);
    }
  </style>
</head>
<body>

  <div class="phone-mockup">
    
    <!-- Barra de Status -->
    <div class="status-bar">
      <div class="time">9:41</div>
      <div class="status-icons">
        <svg viewBox="0 0 17 11" width="16" height="10"><path d="M1 11h2.5V7.5H1V11zm4.5 0h2.5V5h-2.5v6zm4.5 0h2.5V2.5h-2.5V11zm4.5 0H17V0h-2.5v11z"/></svg>
        <svg viewBox="0 0 16 11" width="16" height="11"><path d="M8 11c-1.3 0-2.4-.4-3.3-1.1L8 5.6l3.3 4.3C10.4 10.6 9.3 11 8 11zm0-3.3c-2.3 0-4.3-.8-6-2.2L8 .3l6 7.2c-1.7 1.4-3.7 2.2-6 2.2z"/></svg>
        <svg viewBox="0 0 25 12" width="24" height="11">
          <rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <rect x="3" y="3" width="14" height="6" rx="1" fill="currentColor"/>
          <path d="M23 4v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="dynamic-island"></div>
    
    <!-- Header -->
    <header class="header">
      <div class="logo-container">
        <img src="../imagens/logo.png" class="logo-icon" alt="Logo BarberFlow">
        <h1>Barber<span>Flow</span></h1>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      
      <!-- Seleção de Profissional -->
      <section class="professional-section">
        <h2 class="section-title">Profissional</h2>
        <div class="professional-card">
          <div class="avatar"></div>
          <div class="prof-info">
            <span class="prof-name">Carlos Silva</span>
            <span class="prof-role">Barbeiro Sênior</span>
          </div>
          <div class="chevron">Alterar</div>
        </div>
      </section>

      <!-- Seleção de Serviços -->
      <section class="services-section">
        <h2 class="section-title">Serviços Disponíveis</h2>
        <div class="services-grid">
          
          <label class="service-card">
            <input type="checkbox" name="service" value="corte-social">
            <div class="service-content">
              <div class="custom-checkbox">
                <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
              </div>
              <div class="service-details">
                <span class="service-name">Corte Social</span>
                <span class="service-time">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
                  45 min
                </span>
              </div>
              <div class="service-price">R$ 50</div>
            </div>
          </label>

          <label class="service-card">
            <input type="checkbox" name="service" value="barba-completa">
            <div class="service-content">
              <div class="custom-checkbox">
                <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
              </div>
              <div class="service-details">
                <span class="service-name">Barba Completa</span>
                <span class="service-time">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
                  30 min
                </span>
              </div>
              <div class="service-price">R$ 35</div>
            </div>
          </label>

          <label class="service-card">
            <input type="checkbox" name="service" value="corte-barba" checked>
            <div class="service-content">
              <div class="custom-checkbox">
                <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
              </div>
              <div class="service-details">
                <span class="service-name">Corte + Barba</span>
                <span class="service-time">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
                  75 min
                </span>
              </div>
              <div class="service-price">R$ 80</div>
            </div>
          </label>

        </div>
      </section>
    </main>

    <!-- Footer Flutuante -->
    <footer class="footer">
      <div class="total-area">
        <span class="total-label">Total Estimado</span>
        <span class="total-value">R$ 80,00</span>
      </div>
      <button class="btn-primary">Avançar</button>
    </footer>

  </div>

</body>
</html>
