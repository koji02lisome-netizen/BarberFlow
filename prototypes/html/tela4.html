<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberFlow - S4 Agendamento Confirmado Refinado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* =========================================
       DESIGN SYSTEM UNIFICADO (S1 a S4)
       ========================================= */
    :root {
      --bg-presentation-start: #9ca3af;
      --bg-presentation-end: #4b5563; 
      
      --bg-app: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      
      --accent: #b91c1c;
      --accent-hover: #991b1b;
      
      /* Tons de Sucesso mais vibrantes */
      --success-gradient-1: #22c55e;
      --success-gradient-2: #16a34a;
      
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-btn: 14px;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* =========================================
       MOCKUP DO CELULAR
       ========================================= */
    .phone-mockup {
      width: 100%;
      max-width: 390px;
      height: 844px;
      background-color: var(--bg-app);
      border-radius: 52px; 
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 14px solid #141414;
      box-shadow: 
        0 0 0 2px #374151,
        0 40px 60px -15px rgba(0, 0, 0, 0.65),
        0 20px 30px -10px rgba(0, 0, 0, 0.4);
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      z-index: 101;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-icons svg {
      height: 12px;
      fill: currentColor;
    }

    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background-color: #000000;
      border-radius: 20px;
      z-index: 100;
    }

    /* =========================================
       ÁREA DE CONTEÚDO (S4 - Success State)
       ========================================= */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      padding-top: 100px;
      padding-bottom: 170px; /* Espaço pro rodapé duplo */
      background-color: var(--bg-app);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .main-content::-webkit-scrollbar {
      display: none;
    }

    /* =========================================
       ELEMENTOS DE SUCESSO (Refinados)
       ========================================= */
    .success-icon-container {
      width: 84px;
      height: 84px;
      background: linear-gradient(135deg, var(--success-gradient-1) 0%, var(--success-gradient-2) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(22, 163, 74, 0.3); /* Brilho verde */
    }

    .success-icon-container svg {
      width: 44px;
      height: 44px;
      stroke: #ffffff; /* Check branco */
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .success-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 12px;
      letter-spacing: -0.8px;
      line-height: 1.1;
    }

    /* Protocolo estilo "Ticket" */
    .protocol-badge {
      display: inline-block;
      background-color: transparent;
      border: 1.5px dashed #cbd5e1;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 32px;
      background-color: rgba(255,255,255,0.5);
    }

    .protocol-badge strong {
      color: var(--text-main);
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    /* =========================================
       CARD DE DETALHES DO AGENDAMENTO
       ========================================= */
    .details-card {
      width: 100%;
      background-color: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
      text-align: left;
    }

    .detail-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .detail-row:last-child {
      margin-bottom: 0;
    }

    .detail-icon {
      color: var(--accent);
      margin-top: 2px;
      flex-shrink: 0;
    }

    .detail-icon svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }

    .detail-text {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .detail-text strong {
      color: var(--text-main);
      font-weight: 700;
    }

    /* =========================================
       REGRAS CENTRALIZADAS (Estilo "Pills")
       ========================================= */
    .rules-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .rule-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      background-color: var(--surface);
      padding: 8px 16px;
      border-radius: 20px; /* Formato de pílula */
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.02);
    }

    .rule-item svg {
      width: 14px;
      height: 14px;
      stroke: #94a3b8;
      stroke-width: 2.5;
      fill: none;
      flex-shrink: 0;
    }

    /* =========================================
       RODAPÉ DUPLO PADRONIZADO
       ========================================= */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: var(--surface);
      padding: 18px 24px 34px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.06);
      z-index: 10;
    }

    .btn {
      width: 100%;
      padding: 15px 20px;
      border-radius: var(--radius-btn);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    /* Botão Principal Vermelho (Padronizado) */
    .btn-primary {
      background-color: var(--accent);
      color: var(--surface);
      border: none;
      box-shadow: 0 4px 12px rgba(185, 28, 28, 0.25);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(185, 28, 28, 0.35);
    }

    .btn-primary svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
    }

    /* Botão Secundário Vazado */
    .btn-outline {
      background-color: transparent;
      color: var(--text-main);
      border: 2px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--text-muted);
      background-color: var(--bg-app);
    }
  </style>
</head>
<body>

  <div class="phone-mockup">
    
    <!-- Barra de Status -->
    <div class="status-bar">
      <div class="time">9:41</div>
      <div class="status-icons">
        <svg viewBox="0 0 17 11" width="16" height="10"><path d="M1 11h2.5V7.5H1V11zm4.5 0h2.5V5h-2.5v6zm4.5 0h2.5V2.5h-2.5V11zm4.5 0H17V0h-2.5v11z"/></svg>
        <svg viewBox="0 0 16 11" width="16" height="11"><path d="M8 11c-1.3 0-2.4-.4-3.3-1.1L8 5.6l3.3 4.3C10.4 10.6 9.3 11 8 11zm0-3.3c-2.3 0-4.3-.8-6-2.2L8 .3l6 7.2c-1.7 1.4-3.7 2.2-6 2.2z"/></svg>
        <svg viewBox="0 0 25 12" width="24" height="11">
          <rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <rect x="3" y="3" width="14" height="6" rx="1" fill="currentColor"/>
          <path d="M23 4v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="dynamic-island"></div>
    
    <!-- Conteúdo Principal -->
    <main class="main-content">
      
      <!-- Sucesso Header Refinado -->
      <div class="success-icon-container">
        <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
      </div>
      <h1 class="success-title">Agendamento<br>Confirmado!</h1>
      
      <div class="protocol-badge">
        Protocolo: <strong>#BF-45G2</strong>
      </div>

      <!-- Card de Detalhes -->
      <div class="details-card">
        <div class="detail-row">
          <div class="detail-icon">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <div class="detail-text">
            Reserva para <strong>16 Nov às 15:15</strong><br>com <strong>Carlos Silva</strong>.
          </div>
        </div>
        
        <div class="detail-row">
          <div class="detail-icon">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div class="detail-text">
            <strong>R. XV de Novembro, 1234</strong><br>Joinville/SC
          </div>
        </div>
      </div>

      <!-- Regras Centralizadas em Tags -->
      <div class="rules-container">
        <div class="rule-item">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Tolerância de atraso: 10 minutos
        </div>
        <div class="rule-item">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Cancelamento grátis até 2h antes
        </div>
      </div>

    </main>

    <!-- Rodapé com Botões Padronizados -->
    <footer class="footer">
      <button class="btn btn-primary">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="8" y1="14" x2="16" y2="14"/></svg>
        Adicionar ao Calendar
      </button>
      <button class="btn btn-outline">
        Novo Agendamento
      </button>
    </footer>

  </div>

</body>
</html>
