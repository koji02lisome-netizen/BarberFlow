<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberFlow - S2 Agenda & Horários</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* =========================================
       DESIGN SYSTEM UNIFICADO (S1 & S2)
       ========================================= */
    :root {
      --bg-presentation-start: #9ca3af;
      --bg-presentation-end: #4b5563; 
      
      --bg-app: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #b91c1c;
      --accent-hover: #991b1b;
      --accent-light: #fef2f2;
      --disabled-bg: #f1f5f9;
      --disabled-text: #94a3b8;
      
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-btn: 14px;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* =========================================
       MOCKUP DO CELULAR (Sem frestas internas)
       ========================================= */
    .phone-mockup {
      width: 100%;
      max-width: 390px;
      height: 844px;
      background-color: var(--bg-app);
      border-radius: 52px; 
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 14px solid #141414;
      /* Aro metálico externo (sem inset para não criar degrau na tela) */
      box-shadow: 
        0 0 0 2px #374151,
        0 40px 60px -15px rgba(0, 0, 0, 0.65),
        0 20px 30px -10px rgba(0, 0, 0, 0.4);
    }

    /* Barra de Status */
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      z-index: 101;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-icons svg {
      height: 12px;
      fill: currentColor;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background-color: #000000;
      border-radius: 20px;
      z-index: 100;
    }

    /* =========================================
       CABEÇALHO PADRONIZADO COM BOTÃO DE VOLTAR
       ========================================= */
    .header {
      padding: 54px 24px 16px; 
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .back-button {
      position: absolute;
      left: 20px;
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .back-button:hover {
      background-color: var(--bg-app);
    }

    .back-button svg {
      width: 20px;
      height: 20px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 8px;
    }

    .header h1 {
      font-size: 21px;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: -0.8px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
    }

    .header h1 span {
      font-weight: 400;
      color: var(--accent);
    }

    /* =========================================
       ÁREA DE CONTEÚDO (S2)
       ========================================= */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 155px;
      background-color: var(--bg-app);
    }

    .main-content::-webkit-scrollbar {
      display: none;
    }

    /* =========================================
       SELETOR DE DATAS
       ========================================= */
    .dates-container {
      background-color: var(--surface);
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .dates-scroll {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .date-item input[type="radio"] {
      display: none;
    }

    .date-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 0;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: var(--surface);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.02);
    }

    .date-card:hover {
      border-color: #cbd5e1;
    }

    .date-month {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .date-day {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-main);
    }

    .date-weekday {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Data Selecionada */
    .date-item input[type="radio"]:checked + .date-card {
      background-color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(185, 28, 28, 0.25);
    }

    .date-item input[type="radio"]:checked + .date-card * {
      color: #ffffff;
    }

    /* =========================================
       GRID DE HORÁRIOS
       ========================================= */
    .times-container {
      padding: 24px;
    }

    .period-group {
      margin-bottom: 24px;
    }

    .period-group:last-child {
      margin-bottom: 0;
    }

    .period-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }
    
    .period-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: var(--border);
    }

    .times-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .time-item input[type="radio"] {
      display: none;
    }

    .time-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--surface);
      border: 1.5px solid var(--border);
      min-height: 54px;
      padding: 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.02);
      transition: all 0.2s ease;
      text-align: center;
    }

    .time-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }
    
    .time-status {
      font-size: 11px;
      font-weight: 600;
      margin-top: 2px;
      display: none;
    }

    .time-item input[type="radio"]:not(:disabled):not(:checked) + .time-card:hover {
      border-color: #cbd5e1;
    }

    /* Horário Selecionado */
    .time-item input[type="radio"]:checked + .time-card {
      background-color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(185, 28, 28, 0.25);
    }

    .time-item input[type="radio"]:checked + .time-card .time-value {
      color: #ffffff;
    }
    
    .time-item input[type="radio"]:checked + .time-card .time-status {
      color: rgba(255, 255, 255, 0.9);
      display: block;
    }

    /* Horário Indisponível / Bloqueado */
    .time-item input[type="radio"]:disabled + .time-card {
      background-color: var(--disabled-bg);
      border-color: var(--border);
      cursor: not-allowed;
      box-shadow: none;
    }

    .time-item input[type="radio"]:disabled + .time-card .time-value {
      color: var(--disabled-text);
      text-decoration: line-through;
    }

    .time-item input[type="radio"]:disabled + .time-card .time-status {
      color: var(--disabled-text);
      display: block;
    }

    /* =========================================
       RODAPÉ FIXO PADRONIZADO
       ========================================= */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: var(--surface);
      padding: 18px 24px 30px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.06);
      z-index: 10;
    }

    .summary-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-text {
      display: flex;
      flex-direction: column;
    }

    .summary-datetime {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
    }

    .summary-sub {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 2px;
    }
    
    .summary-price {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--surface);
      border: none;
      width: 100%;
      padding: 15px 28px;
      border-radius: var(--radius-btn);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(185, 28, 28, 0.25);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(185, 28, 28, 0.35);
    }
  </style>
</head>
<body>

  <div class="phone-mockup">
    
    <!-- Barra de Status -->
    <div class="status-bar">
      <div class="time">9:41</div>
      <div class="status-icons">
        <svg viewBox="0 0 17 11" width="16" height="10"><path d="M1 11h2.5V7.5H1V11zm4.5 0h2.5V5h-2.5v6zm4.5 0h2.5V2.5h-2.5V11zm4.5 0H17V0h-2.5v11z"/></svg>
        <svg viewBox="0 0 16 11" width="16" height="11"><path d="M8 11c-1.3 0-2.4-.4-3.3-1.1L8 5.6l3.3 4.3C10.4 10.6 9.3 11 8 11zm0-3.3c-2.3 0-4.3-.8-6-2.2L8 .3l6 7.2c-1.7 1.4-3.7 2.2-6 2.2z"/></svg>
        <svg viewBox="0 0 25 12" width="24" height="11">
          <rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <rect x="3" y="3" width="14" height="6" rx="1" fill="currentColor"/>
          <path d="M23 4v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="dynamic-island"></div>
    
    <!-- Cabeçalho -->
    <header class="header">
      <button class="back-button" aria-label="Voltar">
        <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <div class="logo-container">
        <img src="../imagens/logo.png" class="logo-icon" alt="Logo BarberFlow">
        <h1>Barber<span>Flow</span></h1>
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-content">
      
      <!-- Seletor de Data -->
      <section class="dates-container">
        <h2 class="section-title">Selecione a Data</h2>
        <div class="dates-scroll">
          
          <label class="date-item">
            <input type="radio" name="date" value="nov15">
            <div class="date-card">
              <span class="date-month">Nov</span>
              <span class="date-day">15</span>
              <span class="date-weekday">Ter</span>
            </div>
          </label>

          <label class="date-item">
            <input type="radio" name="date" value="nov16" checked>
            <div class="date-card">
              <span class="date-month">Nov</span>
              <span class="date-day">16</span>
              <span class="date-weekday">Qua</span>
            </div>
          </label>

          <label class="date-item">
            <input type="radio" name="date" value="nov17">
            <div class="date-card">
              <span class="date-month">Nov</span>
              <span class="date-day">17</span>
              <span class="date-weekday">Qui</span>
            </div>
          </label>
          
          <label class="date-item">
            <input type="radio" name="date" value="nov18">
            <div class="date-card">
              <span class="date-month">Nov</span>
              <span class="date-day">18</span>
              <span class="date-weekday">Sex</span>
            </div>
          </label>

        </div>
      </section>

      <!-- Grid de Horários -->
      <section class="times-container">
        
        <!-- Manhã -->
        <div class="period-group">
          <div class="period-title">Manhã</div>
          <div class="times-grid">
            <label class="time-item"><input type="radio" name="time" value="08:00"><div class="time-card"><span class="time-value">08:00</span><span class="time-status">Selecionado</span></div></label>
            <label class="time-item"><input type="radio" name="time" value="08:45"><div class="time-card"><span class="time-value">08:45</span><span class="time-status">Selecionado</span></div></label>
            <label class="time-item"><input type="radio" name="time" value="09:30"><div class="time-card"><span class="time-value">09:30</span><span class="time-status">Selecionado</span></div></label>
            <label class="time-item"><input type="radio" name="time" value="10:15" disabled><div class="time-card"><span class="time-value">10:15</span><span class="time-status">Indisponível</span></div></label>
          </div>
        </div>

        <!-- Tarde -->
        <div class="period-group">
          <div class="period-title">Tarde</div>
          <div class="times-grid">
            <label class="time-item"><input type="radio" name="time" value="13:00"><div class="time-card"><span class="time-value">13:00</span><span class="time-status">Selecionado</span></div></label>
            <label class="time-item"><input type="radio" name="time" value="13:45"><div class="time-card"><span class="time-value">13:45</span><span class="time-status">Selecionado</span></div></label>
            <label class="time-item"><input type="radio" name="time" value="14:30" disabled><div class="time-card"><span class="time-value">14:30</span><span class="time-status">Bloqueado</span></div></label>
            <label class="time-item"><input type="radio" name="time" value="15:15" checked><div class="time-card"><span class="time-value">15:15</span><span class="time-status">Selecionado</span></div></label>
            <label class="time-item"><input type="radio" name="time" value="16:00"><div class="time-card"><span class="time-value">16:00</span><span class="time-status">Selecionado</span></div></label>
            <label class="time-item"><input type="radio" name="time" value="16:45"><div class="time-card"><span class="time-value">16:45</span><span class="time-status">Selecionado</span></div></label>
          </div>
        </div>

        <!-- Noite -->
        <div class="period-group">
          <div class="period-title">Noite</div>
          <div class="times-grid">
            <label class="time-item"><input type="radio" name="time" value="18:00"><div class="time-card"><span class="time-value">18:00</span><span class="time-status">Selecionado</span></div></label>
            <label class="time-item"><input type="radio" name="time" value="18:45"><div class="time-card"><span class="time-value">18:45</span><span class="time-status">Selecionado</span></div></label>
          </div>
        </div>

      </section>
    </main>

    <!-- Rodapé -->
    <footer class="footer">
      <div class="summary-details">
        <div class="summary-text">
          <span class="summary-datetime">16 Nov (Qua) • 15:15</span>
          <span class="summary-sub">Carlos Silva • Corte + Barba</span>
        </div>
        <span class="summary-price">R$ 80,00</span>
      </div>
      <button class="btn-primary">Continuar</button>
    </footer>

  </div>

</body>
</html>
