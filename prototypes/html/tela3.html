<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberFlow - S3 Dados & Confirmação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* =========================================
       DESIGN SYSTEM UNIFICADO (S1, S2 & S3)
       ========================================= */
    :root {
      --bg-presentation-start: #9ca3af;
      --bg-presentation-end: #4b5563; 
      
      --bg-app: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #b91c1c;
      --accent-hover: #991b1b;
      --accent-light: #fef2f2;
      --disabled-bg: #f1f5f9;
      --disabled-text: #94a3b8;
      
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-btn: 14px;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* =========================================
       MOCKUP DO CELULAR
       ========================================= */
    .phone-mockup {
      width: 100%;
      max-width: 390px;
      height: 844px;
      background-color: var(--bg-app);
      border-radius: 52px; 
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 14px solid #141414;
      box-shadow: 
        0 0 0 2px #374151,
        0 40px 60px -15px rgba(0, 0, 0, 0.65),
        0 20px 30px -10px rgba(0, 0, 0, 0.4);
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      z-index: 101;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-icons svg {
      height: 12px;
      fill: currentColor;
    }

    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background-color: #000000;
      border-radius: 20px;
      z-index: 100;
    }

    /* =========================================
       CABEÇALHO PADRONIZADO
       ========================================= */
    .header {
      padding: 54px 24px 16px; 
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .back-button {
      position: absolute;
      left: 20px;
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .back-button:hover {
      background-color: var(--bg-app);
    }

    .back-button svg {
      width: 20px;
      height: 20px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 8px;
    }

    .header h1 {
      font-size: 21px;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: -0.8px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
    }

    .header h1 span {
      font-weight: 400;
      color: var(--accent);
    }

    /* =========================================
       ÁREA DE CONTEÚDO (S3)
       ========================================= */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      padding-bottom: 130px; /* Espaço para o rodapé */
      background-color: var(--bg-app);
    }

    .main-content::-webkit-scrollbar {
      display: none;
    }

    .page-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    /* =========================================
       RESUMO DO AGENDAMENTO (Estilo Recibo)
       ========================================= */
    .summary-card {
      background-color: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      margin-bottom: 28px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .summary-row:last-child {
      margin-bottom: 0;
    }

    .summary-label {
      color: var(--text-muted);
      font-weight: 600;
    }

    .summary-value {
      color: var(--text-main);
      font-weight: 700;
      text-align: right;
    }

    .summary-divider {
      height: 1px;
      background-image: linear-gradient(to right, #cbd5e1 50%, rgba(255,255,255,0) 0%);
      background-position: bottom;
      background-size: 8px 1px;
      background-repeat: repeat-x;
      margin: 14px 0;
    }

    .total-row .summary-label {
      font-size: 15px;
      color: var(--text-main);
    }

    .total-row .summary-value {
      font-size: 18px;
      font-weight: 900;
      color: var(--accent);
    }

    /* =========================================
       FORMULÁRIO DE DADOS
       ========================================= */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      background-color: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-main);
      transition: all 0.2s ease;
      outline: none;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.02);
    }

    .form-control::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    /* Efeito ao focar no input */
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.15);
    }

    textarea.form-control {
      resize: none;
      height: 84px;
      font-family: var(--font-family);
    }

    /* =========================================
       ALERTA DE RESERVA
       ========================================= */
    .reservation-alert {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background-color: var(--accent-light);
      border: 1.5px solid #fecaca;
      padding: 14px;
      border-radius: var(--radius-sm);
      margin-top: 28px;
    }

    .alert-icon {
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .alert-icon svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .alert-text {
      font-size: 12px;
      font-weight: 600;
      color: #991b1b;
      line-height: 1.5;
    }

    /* =========================================
       RODAPÉ FIXO
       ========================================= */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: var(--surface);
      padding: 18px 24px 30px;
      border-top: 1px solid var(--border);
      display: flex;
      box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.06);
      z-index: 10;
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--surface);
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: var(--radius-btn);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(185, 28, 28, 0.25);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(185, 28, 28, 0.35);
    }
  </style>
</head>
<body>

  <div class="phone-mockup">
    
    <!-- Barra de Status -->
    <div class="status-bar">
      <div class="time">9:41</div>
      <div class="status-icons">
        <svg viewBox="0 0 17 11" width="16" height="10"><path d="M1 11h2.5V7.5H1V11zm4.5 0h2.5V5h-2.5v6zm4.5 0h2.5V2.5h-2.5V11zm4.5 0H17V0h-2.5v11z"/></svg>
        <svg viewBox="0 0 16 11" width="16" height="11"><path d="M8 11c-1.3 0-2.4-.4-3.3-1.1L8 5.6l3.3 4.3C10.4 10.6 9.3 11 8 11zm0-3.3c-2.3 0-4.3-.8-6-2.2L8 .3l6 7.2c-1.7 1.4-3.7 2.2-6 2.2z"/></svg>
        <svg viewBox="0 0 25 12" width="24" height="11">
          <rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <rect x="3" y="3" width="14" height="6" rx="1" fill="currentColor"/>
          <path d="M23 4v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="dynamic-island"></div>
    
    <!-- Cabeçalho -->
    <header class="header">
      <button class="back-button" aria-label="Voltar">
        <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <div class="logo-container">
        <img src="../imagens/logo.png" class="logo-icon" alt="Logo BarberFlow">
        <h1>Barber<span>Flow</span></h1>
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-content">
      
      <h2 class="page-title">Complete seus Dados</h2>

      <!-- Resumo Estilo Recibo -->
      <div class="summary-card">
        <div class="summary-row">
          <span class="summary-label">Data:</span>
          <span class="summary-value">16 Nov (Qua) 15:15</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Barbeiro:</span>
          <span class="summary-value">Carlos Silva</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Serviços:</span>
          <span class="summary-value">Corte + Barba</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-row total-row">
          <span class="summary-label">Total:</span>
          <span class="summary-value">R$ 80,00</span>
        </div>
      </div>

      <!-- Formulário -->
      <form action="#" onsubmit="event.preventDefault();">
        
        <div class="form-group">
          <label class="form-label" for="nome">Nome Completo</label>
          <input type="text" id="nome" class="form-control" placeholder="Ex: Rafael Santos Souza" autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="whatsapp">WhatsApp (com DDD)</label>
          <input type="tel" id="whatsapp" class="form-control" placeholder="Ex: (47) 99876-5432" autocomplete="tel">
        </div>

        <div class="form-group">
          <label class="form-label" for="obs">Observações (Opcional)</label>
          <textarea id="obs" class="form-control" placeholder="Ex: Usar máquina n° 2 nas laterais"></textarea>
        </div>

      </form>

      <!-- Alerta de Tempo -->
      <div class="reservation-alert">
        <div class="alert-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </div>
        <div class="alert-text">
          Horário reservado temporariamente por 10 minutos para conclusão.
        </div>
      </div>

    </main>

    <!-- Rodapé -->
    <footer class="footer">
      <button class="btn-primary">Confirmar Agendamento</button>
    </footer>

  </div>

</body>
</html>
